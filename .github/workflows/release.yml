# A tag vX.Y.Z on master builds the release: tests, ready-to-run downloads, GitHub release.
name: release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tag must be on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "Tag $GITHUB_REF_NAME is not on master"; exit 1; }

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          dotnet build CbBridge.sln -c Release -p:Version=$VERSION
          if [ -d tests/CbBridge.Tests ]; then dotnet run -c Release --no-build --project tests/CbBridge.Tests; fi

      - name: Publish (needs the .NET 8 ASP.NET Core runtime on the server)
        run: |
          for rid in win-x64 linux-x64; do
            dotnet publish src/CbBridge.Web -c Release -r $rid --self-contained false -p:Version=$VERSION -o out/$rid
            (cd out/$rid && zip -qr ../../cb-test-bridge-$VERSION-$rid.zip .)
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cb-test-bridge-$VERSION-*.zip \
            --title "CB Test Bridge $VERSION" --generate-notes --verify-tag
